<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="YUMS — rate it, remember it, share it.">

  <!-- Home-screen icon name + artwork (all platforms). NOTE: deliberately
       NO "standalone app" metas or static manifest here — on iOS an
       installed standalone web app gets isolated storage, and OAuth
       sign-in gets ejected to Safari where the session is lost, so Google
       login can never complete inside it. On iOS the home-screen icon
       therefore opens in Safari (where everything works). Android gets
       the real installed app via the manifest, injected below for
       non-iOS browsers only. -->
  <meta name="apple-mobile-web-app-title" content="YUMS">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <!-- Google Maps JS SDK (required by the Food Map on web). -->
  <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyDxz50GD0TCXHmP61WJf7hsxBHWADXP0sw" defer></script>

  <title>YUMS</title>

  <!-- Helpers the Flutter app calls (see lib/services/web_bridge/). -->
  <script>
    let yumsDeferredPrompt = null;
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      yumsDeferredPrompt = e;
    });
    window.yumsCanInstall = () => yumsDeferredPrompt != null;
    window.yumsInstall = async () => {
      if (!yumsDeferredPrompt) return false;
      yumsDeferredPrompt.prompt();
      const choice = await yumsDeferredPrompt.userChoice;
      yumsDeferredPrompt = null;
      return choice.outcome === 'accepted';
    };
    window.yumsIsIos = () => /iphone|ipad|ipod/i.test(navigator.userAgent);
    window.yumsIsAndroid = () => /android/i.test(navigator.userAgent);
    window.yumsIsStandalone = () =>
      window.matchMedia('(display-mode: standalone)').matches ||
      window.navigator.standalone === true;
    window.yumsSaveIcs = (content, filename) => {
      const blob = new Blob([content], { type: 'text/calendar' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 5000);
    };
    // Installed-app manifest for everyone EXCEPT iOS (see note above).
    if (!window.yumsIsIos()) {
      const link = document.createElement('link');
      link.rel = 'manifest';
      link.href = 'manifest.json';
      document.head.appendChild(link);
      const meta = document.createElement('meta');
      meta.name = 'mobile-web-app-capable';
      meta.content = 'yes';
      document.head.appendChild(meta);
    }
  </script>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
