<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="YUMS — rate it, remember it, share it.">

  <!-- iOS meta tags & icons: makes "Add to Home Screen" behave like an app -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="YUMS">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <!-- Google Maps JS SDK (required by the Food Map on web).
       One-time setup: replace GOOGLE_MAPS_KEY_HERE with your Maps API key
       (the same one used for --dart-define). Web keys are public by design;
       restrict it to your site's domain in the Google Cloud console. -->
  <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyDxz50GD0TCXHmP61WJf7hsxBHWADXP0sw" defer></script>

  <title>YUMS</title>
  <link rel="manifest" href="manifest.json">

  <!-- Helpers the Flutter app calls (see lib/services/web_bridge/). -->
  <script>
    let yumsDeferredPrompt = null;
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      yumsDeferredPrompt = e;
    });
    window.yumsCanInstall = () => yumsDeferredPrompt != null;
    window.yumsInstall = async () => {
      if (!yumsDeferredPrompt) return false;
      yumsDeferredPrompt.prompt();
      const choice = await yumsDeferredPrompt.userChoice;
      yumsDeferredPrompt = null;
      return choice.outcome === 'accepted';
    };
    window.yumsIsIos = () => /iphone|ipad|ipod/i.test(navigator.userAgent);
    window.yumsIsAndroid = () => /android/i.test(navigator.userAgent);
    window.yumsIsStandalone = () =>
      window.matchMedia('(display-mode: standalone)').matches ||
      window.navigator.standalone === true;
    window.yumsSaveIcs = (content, filename) => {
      const blob = new Blob([content], { type: 'text/calendar' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 5000);
    };
  </script>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
