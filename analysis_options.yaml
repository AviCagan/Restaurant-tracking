include: package:flutter_lints/flutter.yaml

linter:
  rules:
    prefer_const_constructors: true
    prefer_const_declarations: true

analyzer:
  errors:
    avoid_print: ignore
  exclude:
    # Ready-to-drop Phase 2 code; compiled only after `flutterfire configure`
    # (see FIREBASE_SETUP.md).
    - firebase_setup/**
