name: restaurant_tracker
description: A sleek, fast restaurant rating app.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # Local storage
  sqflite: ^2.3.3
  path: ^1.9.0
  path_provider: ^2.1.4

  # Networking / Google Places REST API
  http: ^1.2.2

  # Media (photos only)
  image_picker: ^1.1.2
  cached_network_image: ^3.4.1

  # Location (for "sort by distance")
  geolocator: ^12.0.0

  # UI / formatting
  google_fonts: ^6.2.1
  intl: ^0.19.0
  uuid: ^4.5.1

dev_dependencies:
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
